[package]
name = "tpt-gpu-serve"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "tpt-serve — OpenAI-compatible HTTP server for TPT GPU LLM inference"
license.workspace = true
repository.workspace = true
keywords = ["gpu", "llm", "inference", "openai", "server"]
