[package]
name = "tpt-gpu-script-lsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "TPT Script Language Server Protocol implementation"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tpt-gpu-script-lsp"
readme = "README.md"
keywords = ["gpu", "compiler", "ml", "ai", "tptscript"]
categories = ["compilers", "development-tools"]

[[bin]]
name = "tpt-gpu-lsp"
path = "src/main.rs"

[dependencies]
tpt-gpu-script-core = { path = "../tpt-gpu-script-core", version = "0.1.0" }
tpt-gpu-script-format = { path = "../tpt-gpu-script-format", version = "0.1.0" }
tokio = { workspace = true }
tower-lsp = { workspace = true }
dashmap = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
