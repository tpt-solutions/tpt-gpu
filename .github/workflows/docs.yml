name: Docs

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Build and deploy docs + playground (GitHub Pages)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install mkdocs
        run: pip install mkdocs mkdocs-material

      - name: Build docs
        run: mkdocs build --strict

      - name: Set up Rust with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build playground WASM
        working-directory: crates/out-gpu-playground
        run: wasm-pack build --target web --out-dir pkg --release

      - name: Stage playground into docs site
        run: |
          mkdir -p site/playground
          cp -r crates/out-gpu-playground/index.html crates/out-gpu-playground/pkg site/playground/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
